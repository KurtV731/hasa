name: HASA server update helper syntax
on:
  push:
    paths:
      - '05 Verwaltung/Werkzeuge/server-update.ps1'
      - '05 Verwaltung/Vorlagen/config-hasa-li.example.php'
      - '05 Verwaltung/**'
      - '01 Entwicklung/Tests/test_folder_installer.ps1'
      - '01 Entwicklung/Tests/test_download_cleanup.ps1'
      - '.github/workflows/hasa-server-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse helper with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd '05 Verwaltung/Werkzeuge/server-update.ps1'),
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell syntax passed. No upload or private connection used.'
      - name: Parse all management scripts
        shell: powershell
        run: |
          Get-ChildItem '05 Verwaltung/Werkzeuge' -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Exercise folder installation without uploads
        shell: powershell
        run: '& "01 Entwicklung/Tests/test_folder_installer.ps1"'
      - name: Verify download cleanup package guards without connections
        shell: powershell
        run: '& "01 Entwicklung/Tests/test_download_cleanup.ps1"'
