name: HASA 39a isolated view verification
on:
  push:
    paths:
      - '3 server/hasa-api/event-views.php'
      - '3 server/tests/event_views_unit.php'
      - '.github/workflows/hasa-39a-quick-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  view-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated PHP view logic
        run: |
          php -l '3 server/hasa-api/event-views.php'
          php '3 server/tests/event_views_unit.php'
      - name: Verify updater syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'server-update-39a.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Build pinned package
        run: python3 '5 tools/build_hasa_39a.py'
