name: Fix HASA 1.1 building requirements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hasa-1.1-gebaeude.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix general building requirement parsing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt')
          s = p.read_text(encoding='utf-8')

          old = '''            if (istTechTreeReverseKontext(link)) return;
            const marker = ermittleTechTreeStufenmarkerFuerLink(link);
            // Kein Marker oder „ab Stufe“ bedeutet: nicht Teil des Vorwärtspfads.
            if (!marker || marker.reverse || !Number.isFinite(marker.level)) return;
            const level = ermittleStufeNebenLink(link);
            if (!Number.isFinite(level)) return;
            const appliesToLevel = marker.level;
'''

          new = '''            if (istTechTreeReverseKontext(link)) return;
            const marker = ermittleTechTreeStufenmarkerFuerLink(link);

            // 1.1 poliert – allgemeiner Gebäude-Fix:
            // Der Community-TechTree beschriftet die BASIS-Voraussetzungen vieler
            // Gebäude nicht ausdrücklich mit „Stufe 1“. Zusätzliche Anforderungen
            // höherer Stufen tragen dagegen einen Stufenmarker (z. B. Stufe 19).
            //
            // Bisher wurden markerlose Basiszeilen komplett verworfen. Dadurch
            // funktionierten bereits oft getestete Ziele wie SHIPYARD, während viele
            // spätere Gebäude scheinbar „keine Mindestanforderungen“ hatten.
            //
            // Regel:
            //   - „ab Stufe N“ bleibt Reverse-Kontext und wird verworfen.
            //   - explizites „Stufe N“ gilt ab genau dieser Objektstufe.
            //   - eine echte Tabellen-Voraussetzungszeile OHNE Stufenmarker ist die
            //     Grundvoraussetzung für Stufe 1.
            if (marker && marker.reverse) return;
            const level = ermittleStufeNebenLink(link);
            if (!Number.isFinite(level)) return;

            let appliesToLevel = null;
            if (marker && Number.isFinite(marker.level)) {
                appliesToLevel = marker.level;
            } else {
                const zeile = link.closest('tr');
                if (!zeile) return;
                appliesToLevel = 1;
            }
'''

          if old not in s:
              raise SystemExit('Parserblock für Stufenmarker nicht gefunden')
          s = s.replace(old, new, 1)

          old = '''            const anforderungen = sammleTechTreeAnforderungen(graph, id, grenze);
            if (!anforderungen.length) {
                throw new Error('Keine direkten Mindestanforderungen erkannt – Datenquelle prüfen.');
            }
'''
          new = '''            const anforderungen = sammleTechTreeAnforderungen(graph, id, grenze);
            if (!anforderungen.length) {
                const roh = objekt && Array.isArray(objekt.requirements) ? objekt.requirements : [];
                if (roh.length) {
                    speichern(STORAGE_TECHTREE_STATUS, {
                        state: 'ok',
                        message: 'Für Zielstufe ' + grenze + ' keine zusätzlichen Mindestanforderungen.',
                        id: id,
                        at: Date.now()
                    });
                    return objekt;
                }
                throw new Error('Keine Mindestanforderungen aus dem TechTree gelesen – TechTree-Seite prüfen.');
            }
'''
          if old not in s:
              raise SystemExit('Fehlermeldungsblock nicht gefunden')
          s = s.replace(old, new, 1)

          s = s.replace("const HASA_BUILD_LABEL = '1.1-poliert-2026-08-26';",
                        "const HASA_BUILD_LABEL = '1.1-poliert-gebaeude-parser-2026-08-26';", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          cp '2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt' /tmp/hasa-1.1.js
          node --check /tmp/hasa-1.1.js

      - name: Commit fix
        run: |
          git config user.name 'ChatGPT HASA'
          git config user.email 'actions@users.noreply.github.com'
          git add '2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt'
          git commit -m 'HASA 1.1 Gebäude-Anforderungen verallgemeinert' || exit 0
          git push
