name: Fix HASA 1.1 TechTree level ranges
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hasa-1.1-stufenbereiche.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse TechTree level ranges correctly
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt')
          s = p.read_text(encoding='utf-8')

          old = """            let m = t.match(/^ab\\s+Stufe\\s*:?[ \\t]*(\\d+)\\b/i);
            if (m) return { level: Number(m[1]), reverse: true, text: t };
            m = t.match(/^Stufe\\s*:?[ \\t]*(\\d+)\\b/i);
            if (m) return { level: Number(m[1]), reverse: false, text: t };
            return null;"""
          new = """            let m = t.match(/^ab\\s+Stufe\\s*:?[ \\t]*(\\d+)\\b/i);
            if (m) return { level: Number(m[1]), reverse: true, text: t };

            // Der Community-TechTree verwendet sowohl „Stufe 1“ als auch
            // Bereiche wie „Stufen 1 - 8“, „Stufen 9 - 10“ usw.
            // Für die Planung gilt eine Forderung ab der ERSTEN Stufe des Bereichs.
            m = t.match(/^Stufen?\\s*:?[ \\t]*(\\d+)\\s*(?:[-–—]\\s*(\\d+))?\\b/i);
            if (m) return {
                level: Number(m[1]),
                endLevel: m[2] ? Number(m[2]) : Number(m[1]),
                reverse: false,
                text: t
            };
            return null;"""
          if old not in s:
              raise SystemExit('Stufenmarker-Funktion nicht gefunden')
          s = s.replace(old, new, 1)

          s = re.sub(r"const HASA_BUILD_LABEL = '[^']*';",
                     "const HASA_BUILD_LABEL = '1.1-poliert-stufenbereiche-2026-08-27';", s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Syntax check
        run: |
          cp '2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt' /tmp/hasa-1.1.js
          node --check /tmp/hasa-1.1.js
      - name: Commit repaired parser
        run: |
          git config user.name 'ChatGPT HASA'
          git config user.email 'actions@users.noreply.github.com'
          git add '2 src/current/hasa_1.1_forschungsmodul-komplett.user.js.txt'
          git commit -m 'HASA 1.1 TechTree Stufenbereiche korrekt auswerten' || exit 0
          git push
