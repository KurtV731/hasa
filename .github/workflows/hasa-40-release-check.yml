name: HASA 40 release check
on:
  push:
    paths:
      - '01 Entwicklung/**'
      - '02 Website/**'
      - '04 Veroeffentlichung/**'
      - '05 Verwaltung/**'
      - '01 Entwicklung/Tests/Browser/test_hasa_techtree_window.cjs'
      - '.github/workflows/hasa-40-release-check.yml'
  workflow_dispatch:
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 '01 Entwicklung/Tests/test_layout.py'
      - run: node --check '01 Entwicklung/Userscript/Aktuell/HASA-AKTUELL.user.js'
      - run: node '01 Entwicklung/Tests/Browser/test_hasa_techtree_window.cjs'
      - run: node --check '04 Veroeffentlichung/Stabil/HASA.user.js'
      - run: cd '04 Veroeffentlichung/Versionen/1.2.0' && sha256sum -c SHA256SUMS.txt
      - name: Check website uploader syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '05 Verwaltung/Werkzeuge/website-upload.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
