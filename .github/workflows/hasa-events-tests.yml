name: HASA events and production
on:
  push:
    paths:
      - '01 Entwicklung/Userscript/Aktuell/HASA-AKTUELL.user.js.txt'
      - '01 Entwicklung/Userscript/Aktuell/HASA-AKTUELL.user.js'
      - '02 Website/api/**'
      - '01 Entwicklung/Tests/Server/events_integration.php'
      - '01 Entwicklung/Tests/Server/maintenance_integration.py'
      - '01 Entwicklung/Tests/Server/initial_password_integration.php'
      - '01 Entwicklung/Tests/Server/system_search_integration.php'
      - '01 Entwicklung/Tests/Server/sharing_global_integration.php'
      - '01 Entwicklung/Datenbank/hasa_1_2_0_sharing_global_migration.sql'
      - '01 Entwicklung/Tests/Browser/test_hasa_*.cjs'
      - '.github/workflows/hasa-events-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-only
          MARIADB_DATABASE: hasa_test_events
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring mariadb-client
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax and browser regression
        run: |
          cmp '01 Entwicklung/Userscript/Aktuell/HASA-AKTUELL.user.js.txt' '01 Entwicklung/Userscript/Aktuell/HASA-AKTUELL.user.js'
          find '02 Website/api' -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 '01 Entwicklung/Tests/Server/maintenance_integration.py'
          node '01 Entwicklung/Tests/Browser/test_hasa_ereignisregister.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_live_events.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_water_history.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_web_ui.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_research.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_menu.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_scroll.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_motivation.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_auth_ui.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_drag.cjs'
          node '01 Entwicklung/Tests/Browser/test_hasa_colony_tooltips.cjs'
      - name: Disposable MariaDB integration
        env:
          MYSQL_PWD: disposable-ci-only
        run: |
          for file in hasa_1_2_0_schema.sql hasa_1_2_0_galaxies_migration.sql hasa_1_2_0_private_migration.sql hasa_1_2_0_useradmin_migration.sql hasa_1_2_0_sharing_migration.sql; do
            mariadb --no-defaults --host=127.0.0.1 --protocol=TCP -uroot hasa_test_events < "01 Entwicklung/Datenbank/$file"
          done
          test_api=$(mktemp -d)
          cp '02 Website/api/'*.php "$test_api/"
          export HASA_TEST_API="$test_api"
          php -r 'file_put_contents(getenv("HASA_TEST_API")."/config.php", "<?php return ".var_export(["database"=>["host"=>"127.0.0.1","name"=>"hasa_test_events","user"=>"root","password"=>getenv("MYSQL_PWD")]],true).";");'
          php '01 Entwicklung/Tests/Server/events_integration.php'
          php '01 Entwicklung/Tests/Server/initial_password_integration.php'
          php '01 Entwicklung/Tests/Server/system_search_integration.php'
          php '01 Entwicklung/Tests/Server/sharing_global_integration.php'
          HASA_TEST_SHARING_HTML="$test_api/sharing-global-fixture.html" node '01 Entwicklung/Tests/Browser/test_hasa_sharing_ui.cjs'
          HASA_TEST_JOURNAL_HTML="$test_api/journal-fixture.html" node '01 Entwicklung/Tests/Browser/test_hasa_journal_ui.cjs'






      - name: Check server updater syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE '05 Verwaltung/Werkzeuge/server-update.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Check TechTree window
        run: node '01 Entwicklung/Tests/Browser/test_hasa_techtree_window.cjs'

