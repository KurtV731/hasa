name: HASA events and production
on:
  push:
    paths:
      - '2 src/current/HASA-AKTUELL.user.js.txt'
      - '2 src/current/HASA-AKTUELL.user.js'
      - '3 server/hasa-api/**'
      - '3 server/tests/events_integration.php'
      - '3 server/tests/maintenance_integration.py'
      - '3 server/tests/initial_password_integration.php'
      - '3 server/tests/system_search_integration.php'
      - '3 server/tests/sharing_global_integration.php'
      - '4 database/hasa_1_2_0_sharing_global_migration.sql'
      - '5 tools/test_hasa_*.cjs'
      - '.github/workflows/hasa-events-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  events:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-only
          MARIADB_DATABASE: hasa_test_events
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring mariadb-client
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Syntax and browser regression
        run: |
          cmp '2 src/current/HASA-AKTUELL.user.js.txt' '2 src/current/HASA-AKTUELL.user.js'
          find '3 server/hasa-api' -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 '3 server/tests/maintenance_integration.py'
          node '5 tools/test_hasa_ereignisregister.cjs'
          node '5 tools/test_hasa_live_events.cjs'
          node '5 tools/test_hasa_web_ui.cjs'
          node '5 tools/test_hasa_research.cjs'
          node '5 tools/test_hasa_menu.cjs'
          node '5 tools/test_hasa_scroll.cjs'
          node '5 tools/test_hasa_motivation.cjs'
          node '5 tools/test_hasa_auth_ui.cjs'
          node '5 tools/test_hasa_drag.cjs'
          node '5 tools/test_hasa_colony_tooltips.cjs'
      - name: Disposable MariaDB integration
        env:
          MYSQL_PWD: disposable-ci-only
        run: |
          for file in hasa_1_2_0_schema.sql hasa_1_2_0_galaxies_migration.sql hasa_1_2_0_private_migration.sql hasa_1_2_0_useradmin_migration.sql hasa_1_2_0_sharing_migration.sql; do
            mariadb --no-defaults --host=127.0.0.1 --protocol=TCP -uroot hasa_test_events < "4 database/$file"
          done
          test_api=$(mktemp -d)
          cp '3 server/hasa-api/'*.php "$test_api/"
          export HASA_TEST_API="$test_api"
          php -r 'file_put_contents(getenv("HASA_TEST_API")."/config.php", "<?php return ".var_export(["database"=>["host"=>"127.0.0.1","name"=>"hasa_test_events","user"=>"root","password"=>getenv("MYSQL_PWD")]],true).";");'
          php '3 server/tests/events_integration.php'
          php '3 server/tests/initial_password_integration.php'
          php '3 server/tests/system_search_integration.php'
          php '3 server/tests/sharing_global_integration.php'
          HASA_TEST_SHARING_HTML="$test_api/sharing-global-fixture.html" node '5 tools/test_hasa_sharing_ui.cjs'



